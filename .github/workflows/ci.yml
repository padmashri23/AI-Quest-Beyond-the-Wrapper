# Continuous integration for Carbon Copilot.
#
# Every push to main and every pull request runs three jobs:
#   backend  - ruff lint, pytest with the coverage gate from pyproject.toml, pip-audit
#   frontend - tsc typecheck, oxlint, vitest with coverage thresholds, vite build, npm audit
#   docker   - builds the production image from the Dockerfile and smoke-tests /api/health
# Coverage reports and the built dashboard are uploaded as workflow artifacts.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '24'

jobs:
  backend:
    name: Backend (lint, tests, coverage, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LYZR_DISABLED: 'true'
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install pinned dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Tests with coverage gate
        run: |
          mkdir -p reports
          python -m pytest --cov --cov-report=term-missing --cov-report=xml:reports/backend-coverage.xml --junitxml=reports/backend-junit.xml
      - name: Dependency advisories
        run: python -m pip_audit -r backend/requirements.txt --progress-spinner off
      - name: Upload backend reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: reports/
          retention-days: 14

  frontend:
    name: Frontend (typecheck, lint, tests, build, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests with coverage thresholds
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Dependency advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Upload dashboard build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 14
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 14

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: carbon-copilot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name copilot -p 8000:8000 -e LYZR_DISABLED=true -e APP_ENV=development carbon-copilot:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health > /dev/null; then
              echo "healthy after ${attempt} checks"
              exit 0
            fi
            sleep 2
          done
          docker logs copilot
          exit 1
